name: Tests & Quality

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]
        laravel: ["10", "11", "12"]
        exclude:
          # Laravel 10 only supports PHP 8.1+
          - php: "8.0"
            laravel: "10"

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: xdebug

      - name: Install dependencies
        run: |
          composer require --no-interaction --no-update illuminate/support:${{ matrix.laravel }}.* illuminate/view:${{ matrix.laravel }}.*
          composer update --prefer-dist --no-interaction

      - name: Run Tests
        run: php vendor/bin/phpunit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage.xml
          fail_ci_if_error: false

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: json, mbstring

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Run PHPStan
        run: php vendor/bin/phpstan analyse

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: json, mbstring

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Check code style
        run: php vendor/bin/pint --test
